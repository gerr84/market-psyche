# Data-center / sovereign-AI / neocloud monitoring sources
# Scored for early signals on WHO is building, WHERE, and any CANCELLATIONS.
sources:
  - id: reuters_dc
    name: Reuters Data Centers
    type: rss
    url: https://www.reuters.com/technology/artificial-intelligence/rss
    credibility: 1.5
  - id: bloomberg_dc
    name: Bloomberg Technology
    type: rss
    url: https://www.bloomberg.com/technology/rss
    credibility: 1.5
  - id: datacenterdynamics
    name: Data Center Dynamics
    type: rss
    url: https://www.datacenterdynamics.com/en/feed/
    credibility: 1.4
  - id: semianalysis
    name: SemiAnalysis
    type: rss
    url: https://www.semianalysis.com/feed/
    credibility: 1.6
  - id: cnas_sovereign
    name: CNAS Sovereign AI
    type: rss
    url: https://www.cnas.org/feed/
    credibility: 1.4
  - id: reddit_dc
    name: r/datacenter
    type: reddit
    url: https://www.reddit.com/r/datacenter/new/.rss
    credibility: 1.0

# keyword weights for DC / sovereign / neocloud signals
keywords:
  build: 1.6
  builds: 1.6
  construction: 1.4
  groundbreaking: 1.5
  capacity: 1.3
  gigawatt: 1.7
  megawatt: 1.3
  hyperscaler: 1.4
  sovereign: 1.8
  sovereignty: 1.8
  cancelled: 1.7
  canceled: 1.7
  paused: 1.5
  stalled: 1.5
  delayed: 1.3
  colocation: 1.2
  neocloud: 1.5
  overseas: 1.2
  UAE: 1.3
  Saudi: 1.3
  Europe: 1.1
  consent: 1.4
  power: 1.2

# source credibility bonuses (multiplicative)
source_weights:
  reuters_dc: 1.5
  bloomberg_dc: 1.5
  semianalysis: 1.6
  datacenterdynamics: 1.4
  cnas_sovereign: 1.4
  reddit_dc: 1.0

min_score: 1.5
lookback_hours: 168
